<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked by SiteGuard</title>
  <style>
    :root {
      --danger: #dc2626;
      --danger-dark: #991b1b;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-dark: #b45309;
      --warning-bg: #fffbeb;
      --safe: #059669;
      --safe-dark: #047857;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --page-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--page-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      background: var(--danger);
      color: #ffffff;
      padding: 1.75rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .header.warning-mode {
      background: var(--warning);
    }

    .header-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }

    .header-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .header-text p {
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .content {
      padding: 2rem;
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .host-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--danger-dark);
      word-break: break-all;
      margin-bottom: 1.25rem;
    }

    .real-address-line {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      font-size: 1rem;
    }

    .real-address-host {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: var(--safe);
      font-size: 1.1rem;
    }

    .grid-info {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 2rem;
      margin-bottom: 2rem;
      align-items: center;
    }

    .reasons-box h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .reasons-list {
      list-style: none;
    }

    .reasons-list li {
      position: relative;
      padding-left: 1.25rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #334155;
    }

    .reasons-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--danger);
      font-weight: bold;
      font-size: 1.2rem;
      line-height: 1;
    }

    .dial-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #fafafa;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .circle-dial {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 6px solid var(--danger);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .dial-number {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
    }

    .dial-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .badge-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--danger);
      padding: 0.25rem 0.85rem;
      border-radius: 9999px;
      text-transform: capitalize;
    }

    .badge-pill.warning-pill {
      background: var(--warning);
    }

    [hidden] {
      display: none !important;
    }

    .action-container {
      margin-top: 1rem;
    }

    .btn-real {
      width: 100%;
      background: var(--safe);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 1.15rem 1.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: background 0.15s ease-in-out, transform 0.05s ease-in-out;
      text-decoration: none;
    }

    .btn-real:hover {
      background: var(--safe-dark);
    }

    .btn-real:active {
      transform: scale(0.99);
    }

    .btn-real-sub {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .footer-links a {
      color: #475569;
      text-decoration: underline;
      cursor: pointer;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    .continue-container {
      margin-top: 1.25rem;
      text-align: center;
    }

    .btn-continue {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-continue:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="header-bar" class="header">
      <div id="header-icon" class="header-icon">✕</div>
      <div class="header-text">
        <h1 id="title-text">Suspicious website blocked</h1>
        <p id="subtitle-text">SiteGuard stopped it before the page could load. Do not enter any details.</p>
      </div>
    </div>

    <div class="content">
      <div class="section-label" id="label-tried">You tried to open</div>
      <div id="host-display" class="host-box">...</div>

      <div id="real-address-container" class="real-address-line" hidden>
        <span id="label-real">The real address is</span>
        <span id="real-domain" class="real-address-host"></span>
      </div>

      <div class="grid-info">
        <div class="reasons-box">
          <h2 id="why-title">Why it was blocked</h2>
          <ul id="reasons-list" class="reasons-list">
            <!-- Reasons populated dynamically -->
          </ul>
        </div>

        <div class="dial-card">
          <div id="circle-dial" class="circle-dial">
            <span id="score-text" class="dial-number">—</span>
            <span id="out-of-text" class="dial-sub">out of 100</span>
          </div>
          <span id="level-badge" class="badge-pill">...</span>
        </div>
      </div>

      <div class="action-container">
        <button id="go-real" class="btn-real" hidden>
          <span id="btn-main-text">Take me to the official website</span>
          <span id="btn-sub-text" class="btn-real-sub">verified in the official registry</span>
        </button>
      </div>

      <div id="continue-box" class="continue-container" hidden>
        <button id="btn-continue" class="btn-continue">
          I understand the risk, continue anyway (<span id="countdown">5</span>s)
        </button>
      </div>

      <div class="footer-links">
        <a id="link-report" href="#">Report this site</a>
        <a id="link-why" href="#">Why was this blocked?</a>
      </div>
    </div>
  </div>

  <script type="module" src="warning.js"></script>
</body>
</html>
