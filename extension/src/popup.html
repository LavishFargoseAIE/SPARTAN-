<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SiteGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    .header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s ease;
    }
    .safe-bg { background: #059669; color: #ffffff; }
    .warning-bg { background: #d97706; color: #ffffff; }
    .danger-bg { background: #dc2626; color: #ffffff; }
    .neutral-bg { background: #1e293b; color: #38bdf8; border-bottom: 1px solid #334155; }
    .offline-bg { background: #7c2d12; color: #fed7aa; }

    .content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .host-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      word-break: break-all;
      background: #1e293b;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .score-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .score-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f8fafc;
    }
    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .reasons-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: #cbd5e1;
    }
    .reasons-list li {
      position: relative;
      padding-left: 1.1rem;
      line-height: 1.3;
    }
    .reasons-list li::before {
      content: "•";
      position: absolute;
      left: 0.2rem;
      color: #64748b;
    }
    .btn-action {
      margin-top: 0.25rem;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s ease;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-gray { background: #475569; }
    .btn-green { background: #059669; }
    .btn-red { background: #dc2626; }
    .btn-amber { background: #b45309; }
  </style>
</head>
<body>
  <div id="popup-header" class="header neutral-bg">
    <span id="popup-icon">🛡</span>
    <span id="popup-title">SiteGuard</span>
  </div>

  <div class="content">
    <div id="popup-host" class="host-text">Checking hostname...</div>

    <div class="score-row">
      <span id="popup-score" class="score-num">—</span>
      <span class="score-label">risk score</span>
    </div>

    <ul id="popup-reasons" class="reasons-list">
      <li>Connecting to SiteGuard engine...</li>
    </ul>

    <button id="popup-btn" class="btn-action btn-gray" style="display: none;">Report site</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
