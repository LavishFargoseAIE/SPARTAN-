<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SiteGuard</title>
  <style>
    :root {
      --bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary-blue: #2563eb;
      --primary-blue-hover: #1d4ed8;
      --safe: #059669;
      --safe-bg: #dcfce7;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 340px;
      background: var(--bg);
      color: var(--text-main);
      padding: 1.25rem;
      border-radius: 16px;
      overflow: hidden;
    }

    /* Top Status Header matching Image 4 */
    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .shield-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .shield-icon svg {
      width: 20px;
      height: 20px;
    }

    .shield-safe { background: var(--safe-bg); color: var(--safe); }
    .shield-warning { background: var(--warning-bg); color: var(--warning); }
    .shield-danger { background: var(--danger-bg); color: var(--danger); }

    .status-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .status-safe .status-title { color: var(--safe); }
    .status-warning .status-title { color: var(--warning); }
    .status-danger .status-title { color: var(--danger); }

    .status-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-top: 1px;
    }

    .status-score {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* Progress bar */
    .meter-container {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .meter-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 9999px;
    }

    .bar-safe { background: var(--safe); }
    .bar-warning { background: var(--warning); }
    .bar-danger { background: var(--danger); }

    /* Host Box */
    .host-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
      margin-bottom: 1rem;
    }

    /* Reasons List */
    .reasons-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.88rem;
      color: #334155;
      margin-bottom: 1.2rem;
    }

    .reasons-list li {
      position: relative;
      padding-left: 1.15rem;
      line-height: 1.4;
    }

    .reasons-list li::before {
      content: "•";
      position: absolute;
      left: 0.15rem;
      color: var(--text-main);
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Blue Action Button matching Image 4 */
    .btn-action {
      width: 100%;
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease;
      margin-bottom: 1.25rem;
      display: block;
    }

    .btn-action:hover {
      background: var(--primary-blue-hover);
    }

    /* Info Callout Card */
    .info-callout {
      background: #f0f7ff;
      border: 1px solid #c7e0f9;
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      font-size: 0.84rem;
      color: #1e40af;
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }

    /* Footer Links matching Image 4 */
    .footer-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.88rem;
    }

    .footer-links a {
      color: var(--primary-blue);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }

    .footer-links a:hover {
      color: var(--primary-blue-hover);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Header matching Image 4 -->
  <div id="status-card-header" class="status-header status-safe">
    <div class="status-left">
      <div id="shield-icon" class="shield-icon shield-safe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div id="popup-title" class="status-title">Safe</div>
        <div id="popup-subtitle" class="status-subtitle">This is the real site</div>
      </div>
    </div>
    <div id="popup-score" class="status-score">0 / 100</div>
  </div>

  <!-- Progress Bar -->
  <div class="meter-container">
    <div id="meter-bar" class="meter-bar bar-safe" style="width: 100%;"></div>
  </div>

  <!-- Current Host Box -->
  <div id="popup-host" class="host-box">...</div>

  <!-- Bullet points -->
  <ul id="popup-reasons" class="reasons-list">
    <!-- Populated dynamically -->
  </ul>

  <!-- Action button (e.g. Go to the real site) -->
  <button id="popup-btn" class="btn-action" hidden>Go to the real site</button>

  <!-- Info Callout Card for Unconfirmed Dangerous sites -->
  <div id="popup-callout" class="info-callout" hidden>
    We cannot confirm the real site yet. Use your bank's app or an address you know.
  </div>

  <!-- Footer Links matching Image 4 -->
  <div class="footer-links">
    <a id="link-report" href="#">Report</a>
    <a id="link-why" href="#">Why?</a>
    <a id="link-settings" href="#">Settings</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
