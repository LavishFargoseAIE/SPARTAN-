services:
  redis:
    image: redis:7-alpine
    container_name: siteguard-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: siteguard-postgres
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: siteguard
      POSTGRES_DB: siteguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siteguard-api
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://siteguard:siteguard@postgres:5432/siteguard
      - SITEGUARD_API_URL=http://localhost:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
